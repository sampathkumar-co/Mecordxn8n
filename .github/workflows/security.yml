name: Security

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Repository secret scan
        run: node scripts/secret-scan.mjs

  container-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build --pull -t mecordxn8n-control:security .
          docker build --pull -f Dockerfile.browser -t mecordxn8n-browser:security .
      - name: Scan control image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mecordxn8n-control:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan browser image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mecordxn8n-browser:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
