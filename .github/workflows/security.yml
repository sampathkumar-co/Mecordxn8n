name: Security

on:
  push:
    branches:
      - main
      - "build/**"
      - "hardening/**"
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Repository secret scan
        run: node scripts/secret-scan.mjs
      - name: Full-history secret scan
        run: node scripts/history-secret-scan.mjs

  container-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production images
        run: |
          docker build --pull -t mecordxn8n-control:security .
          docker build --pull -f Dockerfile.browser -t mecordxn8n-browser:security .
      - name: Scan control image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mecordxn8n-control:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan browser image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mecordxn8n-browser:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
