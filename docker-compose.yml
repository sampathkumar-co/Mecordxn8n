x-node-hardening: &node-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app-db

  n8n-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_POSTGRES_DB}
      POSTGRES_USER: ${N8N_POSTGRES_USER}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_POSTGRES_USER} -d ${N8N_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - n8n-db

  control-api:
    <<: *node-hardening
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN}
      MECORDXN8N_HTTP_OBSERVER_URL: http://http-observer:8090
      MECORDXN8N_BROWSER_QA_URL: http://browser-qa:8091
      MECORDXN8N_SITE_DISCOVERY_URL: http://site-discovery:8092
      MECORDXN8N_JOURNEY_QA_URL: http://journey-qa:8093
      MECORDXN8N_VERIFICATION_URL: http://finding-verification:8094
      MECORDXN8N_REMEDIATION_URL: http://remediation:8095
      MECORDXN8N_INTEGRATION_URL: http://integration-delivery:8096
      WORKER_TOKEN_HTTP_OBSERVER: ${WORKER_TOKEN_HTTP_OBSERVER}
      WORKER_TOKEN_BROWSER_QA: ${WORKER_TOKEN_BROWSER_QA}
      WORKER_TOKEN_SITE_DISCOVERY: ${WORKER_TOKEN_SITE_DISCOVERY}
      WORKER_TOKEN_JOURNEY_QA: ${WORKER_TOKEN_JOURNEY_QA}
      WORKER_TOKEN_FINDING_VERIFICATION: ${WORKER_TOKEN_FINDING_VERIFICATION}
      WORKER_TOKEN_REMEDIATION: ${WORKER_TOKEN_REMEDIATION}
      WORKER_TOKEN_INTEGRATION: ${WORKER_TOKEN_INTEGRATION}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY}
      PLATFORM_AUTH_KEY: ${PLATFORM_AUTH_KEY}
      REQUIRE_PRIVILEGED_MFA: ${REQUIRE_PRIVILEGED_MFA:-true}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-true}
      MFA_STEP_UP_MINUTES: ${MFA_STEP_UP_MINUTES:-30}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node scripts/migrate.mjs && node src/server.js"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
      - app-db
      - orchestrator-net
      - http-observer-net
      - browser-qa-net
      - site-discovery-net
      - journey-qa-net
      - verification-net
      - remediation-net
      - integration-net

  http-observer:
    <<: *node-hardening
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      MECORDXN8N_CONTROL_API_URL: http://control-api:8080
      WORKER_TOKEN: ${WORKER_TOKEN_HTTP_OBSERVER}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN}
      WORKER_ID: public-http-observer
      WORKER_PORT: 8090
    depends_on:
      control-api:
        condition: service_started
    command: node src/workers/http-observer-service.js
    networks:
      - http-observer-net

  browser-qa:
    <<: *node-hardening
    build: &browser-build
      context: .
      dockerfile: Dockerfile.browser
    restart: unless-stopped
    user: pwuser
    shm_size: "1gb"
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /home/pwuser/.cache:rw,nosuid,size=128m
    environment:
      MECORDXN8N_CONTROL_API_URL: http://control-api:8080
      WORKER_TOKEN: ${WORKER_TOKEN_BROWSER_QA}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN}
      WORKER_ID: browser-qa-worker
      WORKER_PORT: 8091
      ARTIFACT_DIR: /artifacts
    depends_on:
      control-api:
        condition: service_started
    command: node src/workers/browser-qa-service.js
    volumes:
      - browser_artifacts:/artifacts
    networks:
      - browser-qa-net

  site-discovery:
    <<: *node-hardening
    build: *browser-build
    restart: unless-stopped
    user: pwuser
    shm_size: "1gb"
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /home/pwuser/.cache:rw,nosuid,size=128m
    environment:
      MECORDXN8N_CONTROL_API_URL: http://control-api:8080
      WORKER_TOKEN: ${WORKER_TOKEN_SITE_DISCOVERY}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN}
      WORKER_ID: site-discovery-worker
      WORKER_PORT: 8092
      ARTIFACT_DIR: /artifacts
    depends_on:
      control-api:
        condition: service_started
    command: node src/workers/site-discovery-service.js
    volumes:
      - discovery_artifacts:/artifacts
    networks:
      - site-discovery-net

  journey-qa:
    <<: *node-hardening
    build: *browser-build
    restart: unless-stopped
    user: pwuser
    shm_size: "1gb"
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /home/pwuser/.cache:rw,nosuid,size=128m
    environment:
      MECORDXN8N_CONTROL_API_URL: http://control-api:8080
      WORKER_TOKEN: ${WORKER_TOKEN_JOURNEY_QA}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN}
      WORKER_ID: journey-qa-worker
      WORKER_PORT: 8093
      ARTIFACT_DIR: /artifacts
    depends_on:
      control-api:
        condition: service_started
    command: node src/workers/journey-qa-service.js
    volumes:
      - journey_artifacts:/artifacts
    networks:
      - journey-qa-net

  finding-verification:
    <<: *node-hardening
    build: *browser-build
    restart: unless-stopped
    user: pwuser
    shm_size: "1gb"
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /home/pwuser/.cache:rw,nosuid,size=128m
    environment:
      MECORDXN8N_CONTROL_API_URL: http://control-api:8080
      WORKER_TOKEN: ${WORKER_TOKEN_FINDING_VERIFICATION}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN}
      WORKER_ID: finding-verification-worker
      WORKER_PORT: 8094
      ARTIFACT_DIR: /artifacts
    depends_on:
      control-api:
        condition: service_started
    command: node src/workers/finding-verification-service.js
    volumes:
      - verification_artifacts:/artifacts
    networks:
      - verification-net

  remediation:
    <<: *node-hardening
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      MECORDXN8N_CONTROL_API_URL: http://control-api:8080
      WORKER_TOKEN: ${WORKER_TOKEN_REMEDIATION}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN}
      WORKER_ID: mecord-remediation-worker
      WORKER_PORT: 8095
      MECORD_MCP_URL: ${MECORD_MCP_URL:-}
      MECORD_MCP_TOKEN: ${MECORD_MCP_TOKEN:-}
      MECORD_MCP_REMEDIATION_TOOL: ${MECORD_MCP_REMEDIATION_TOOL:-operations}
    depends_on:
      control-api:
        condition: service_started
    command: node src/workers/remediation-service.js
    networks:
      - remediation-net

  integration-delivery:
    <<: *node-hardening
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      MECORDXN8N_CONTROL_API_URL: http://control-api:8080
      WORKER_TOKEN: ${WORKER_TOKEN_INTEGRATION}
      WORKER_TRIGGER_TOKEN: ${WORKER_TRIGGER_TOKEN}
      WORKER_ID: integration-delivery-worker
      WORKER_PORT: 8096
    depends_on:
      control-api:
        condition: service_started
    command: node src/workers/integration-service.js
    networks:
      - integration-net

  n8n:
    <<: *node-hardening
    image: docker.n8n.io/n8nio/n8n:2.40.7
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      MECORDXN8N_CONTROL_API_URL: http://control-api:8080
      MECORDXN8N_ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN}
    depends_on:
      n8n-postgres:
        condition: service_healthy
      control-api:
        condition: service_started
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n-db
      - orchestrator-net

volumes:
  postgres_data:
  n8n_postgres_data:
  n8n_data:
  browser_artifacts:
  discovery_artifacts:
  journey_artifacts:
  verification_artifacts:

networks:
  edge:
  app-db:
    internal: true
  n8n-db:
    internal: true
  orchestrator-net:
    internal: true
  http-observer-net:
  browser-qa-net:
  site-discovery-net:
  journey-qa-net:
  verification-net:
  remediation-net:
  integration-net:
